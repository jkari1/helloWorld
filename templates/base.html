
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block page_title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Jayant's Website</a>

            <div>
                <a class="text-white me-3" href="{{ url_for('favorite_course') }}">Favorite Course</a>
                <a class="text-white" href="{{ url_for('contact') }}">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <h1>{% block page_heading %}{% endblock %}</h1>

        {% block page_content %}
        {% endblock %}

    </div>

</body>
</html>
